name: CI

on:
  push:
    branches: [main]
    paths:
      - "Back-end/**"
  pull_request:
    branches: [main]
    paths:
      - "Back-end/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Back-end/Sayiad.API/Sayiad.API.csproj

      - name: Build
        run: dotnet build Back-end/Sayiad.API/Sayiad.API.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Back-end/Sayiad.Tests/Sayiad.Tests.csproj --configuration Release --verbosity normal
